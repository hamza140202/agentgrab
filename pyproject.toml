[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgrab"
version = "1.0.0"
description = "yt-dlp for AI agents — cookieless YouTube & Instagram downloads with self-healing fallback chains"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "hamza140202" }]
keywords = ["yt-dlp", "youtube", "instagram", "downloader", "ai-agents", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "yt-dlp>=2026.8.1",
    "instaloader>=4.14",
    "bgutil-ytdlp-pot-provider>=2.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agrab = "agentgrab.cli:main"

[tool.setuptools.packages.find]
include = ["agentgrab*"]
